[project]
name = "lnvox"
version = "0.1.0"
description = "Novel-to-audiobook AI pipeline (Gemma 4 + Dramabox)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "beautifulsoup4>=4.12",  # EPUB XHTML parsing in lnvox.ingest.epub
]

[project.optional-dependencies]
serve = [
    # Linux/CUDA LLM phase. vLLM has no macOS wheels, so the whole extra
    # is marker-gated. The Apple Silicon equivalent is the `mlx` extra.
    # vLLM is pulled from the nightly wheel index (see [tool.uv.sources]
    # and the vllm-nightly index below); nightly builds carry `.dev`
    # versions, hence the global `prerelease = "allow"` in [tool.uv].
    "vllm>=0.22.0 ; sys_platform == 'linux'",
    "transformers>=5.10.1 ; sys_platform == 'linux'",
    "torch ; sys_platform == 'linux'",
]
mlx = [
    # Apple Silicon LLM phase: mlx_lm.server exposes an OpenAI-compatible
    # endpoint so LLMClient works unchanged. See DESIGN.md §11.
    "mlx-lm>=0.20 ; sys_platform == 'darwin'",
]
voice = [
    "soundfile>=0.12",
    "librosa>=0.10",
    "tqdm>=4.65",
]
render = [
    # Lecture mode (DESIGN.md §13.2c): rasterize code/tables to PNG.
    # Pygments highlights code; Playwright (headless Chromium) does HTML→PNG.
    # After install, run `playwright install chromium` once to fetch the
    # browser. Both are imported lazily — lecture ingest degrades to HTML-only
    # visual elements when this extra is absent.
    "pygments>=2.17",
    "playwright>=1.40",
]
tts = [
    # Dramabox is git-cloned (see scripts/setup_dramabox.sh) — its
    # requirements.txt is installed by that script and pins torch==2.8.
    # We deliberately don't pin torch here because vLLM requires a
    # newer torchaudio than Dramabox; the DramaboxClient monkey-patches
    # torchaudio.save() so version mismatches don't trip the WAV writer.
    # VibeVoice is likewise git-cloned (scripts/setup_vibevoice.sh) and
    # pip-installed editable; soxr is the 24k→48k resampler its client
    # uses at save time (DESIGN.md §16.4).
    "soundfile>=0.12",
    "huggingface-hub>=0.24",
    "soxr>=0.5",
]

[project.scripts]
lnvox = "lnvox.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lnvox"]

[tool.hatch.build.targets.wheel.force-include]
"src/lnvox/llm/prompts" = "lnvox/llm/prompts"

[tool.uv]
package = true
# Nightly vLLM wheels are versioned as `.dev` builds, so prereleases must
# be allowed for the resolver to accept them. This is global, but the
# nightly index below is `explicit`, so only vllm is sourced from it.
prerelease = "allow"

[tool.uv.sources]
# Linux-only: pull torch from the cu130 wheel index. macOS picks up the
# default PyPI wheel (MPS-capable), so leaving this unconditional would
# break `uv sync` on Apple Silicon. See DESIGN.md §11.
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]
# Linux-only: pull vLLM from its nightly wheel index (cu130 variant to
# match torch above). Marker-gated so `uv sync` on macOS is unaffected.
vllm = [
    { index = "vllm-nightly", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "vllm-nightly"
url = "https://wheels.vllm.ai/nightly/cu130"
explicit = true
